<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" stroke="#4a90e2" stroke-width="2"/>
  
  <!-- Letter "O" -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">O</text>
  
  <!-- Letter "M" -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">M</text>
  
  <!-- Company Name -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4a90e2">OM JADHAV</text>
  
  <!-- Tagline -->
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="12" fill="#7b68ee">Full Stack Developer</text>
  
  <!-- Decorative Elements -->
  <circle cx="180" cy="15" r="3" fill="#6c5ce7" opacity="0.7"/>
  <circle cx="185" cy="25" r="2" fill="#4a90e2" opacity="0.5"/>
  <circle cx="175" cy="35" r="2.5" fill="#7b68ee" opacity="0.6"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b68ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
