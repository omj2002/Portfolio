<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="28" fill="url(#iconGradient)" stroke="#4a90e2" stroke-width="2"/>
  
  <!-- Inner Circle -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  
  <!-- Letter "O" -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">O</text>
  
  <!-- Letter "M" -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">M</text>
  
  <!-- Decorative Dots -->
  <circle cx="45" cy="15" r="2" fill="white" opacity="0.6"/>
  <circle cx="50" cy="25" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="40" cy="45" r="1.5" fill="white" opacity="0.5"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b68ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
