<section id="projects" class="projects-section">
  <div class="container">
    <div class="section-header">
      <h2 *ngIf="translations$ | async as translations">{{ translations.projects.title }}</h2>
      <h2 *ngIf="!(translations$ | async)">My Projects</h2>
      <p *ngIf="translations$ | async as translations">{{ translations.projects.subtitle }}</p>
      <p *ngIf="!(translations$ | async)">Some of my recent work and side projects</p>
    </div>
    
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects$ | async">
        <div class="project-image">
          <div class="image-placeholder">
            <i class="fas fa-laptop-code"></i>
          </div>
        </div>
        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="project-tech">
            <span class="tech-tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
          <div class="project-links">
            <a [href]="project.liveUrl" target="_blank" class="btn btn-primary">
              <span *ngIf="translations$ | async as translations">{{ translations.projects.viewProject }}</span>
              <span *ngIf="!(translations$ | async)">Live Demo</span>
            </a>
            <a [href]="project.githubUrl" target="_blank" class="btn btn-secondary">
              <span *ngIf="translations$ | async as translations">{{ translations.projects.viewCode }}</span>
              <span *ngIf="!(translations$ | async)">GitHub</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
